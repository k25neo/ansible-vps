---
- name: Install Docker dependencies
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gnupg, lsb-release, python3-pip]
    update_cache: true

- name: Download Docker install script
  ansible.builtin.get_url:
    url: https://get.docker.com
    dest: /tmp/get-docker.sh
    mode: "0755"

- name: Install Docker
  ansible.builtin.command: /tmp/get-docker.sh
  args:
    creates: /usr/bin/docker

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Install iptables-nft (compatibility layer)
  ansible.builtin.apt:
    name: [iptables, arptables, ebtables]
    state: present

- name: Check current iptables alternative
  ansible.builtin.command: readlink -f /etc/alternatives/iptables
  register: mtproxy_current_iptables
  changed_when: false

- name: Set iptables to nft backend
  ansible.builtin.command: update-alternatives --set iptables /usr/sbin/iptables-nft
  when: mtproxy_current_iptables.stdout != '/usr/sbin/iptables-nft'
  changed_when: true
  notify: Restart docker

- name: Check current ip6tables alternative
  ansible.builtin.command: readlink -f /etc/alternatives/ip6tables
  register: mtproxy_current_ip6tables
  changed_when: false

- name: Set ip6tables to nft backend
  ansible.builtin.command: update-alternatives --set ip6tables /usr/sbin/ip6tables-nft
  when: mtproxy_current_ip6tables.stdout != '/usr/sbin/ip6tables-nft'
  changed_when: true
  notify: Restart docker

- name: Flush handlers to restart docker now
  ansible.builtin.meta: flush_handlers

- name: Creates etc directory
  ansible.builtin.file:
    path: /etc/mtproto
    state: directory
    mode: "0755"

- name: Check if secret file exists on remote server
  ansible.builtin.stat:
    path: /etc/mtproto/secret.yml
  register: mtproxy_secret_file_result

- name: Read secret from remote server (если файл есть)
  ansible.builtin.slurp:
    src: /etc/mtproto/secret.yml
  register: mtproxy_remote_secret_b64
  when: mtproxy_secret_file_result.stat.exists

- name: Set secret fact from remote file
  ansible.builtin.set_fact:
    # Декодируем из base64 и вытаскиваем значение через regex или split
    mtproxy_user_secret: "{{ (mtproxy_remote_secret_b64.content | b64decode | from_yaml).mtproto_user_secret }}"
  when: mtproxy_secret_file_result.stat.exists

- name: Generate random hexadecimal string (если секрета еще нет)
  ansible.builtin.set_fact:
    mtproxy_user_secret: "{{ lookup('community.general.random_string', length=32, chars='hexdigits') }}"
  when: mtproxy_user_secret is not defined

- name: Write secret to remote file (только при создании)
  ansible.builtin.copy:
    content: "mtproto_user_secret: {{ mtproxy_user_secret }}"
    dest: /etc/mtproto/secret.yml
    mode: "0600"
  when: not mtproxy_secret_file_result.stat.exists

- name: Run Telegram Proxy Container
  community.docker.docker_container:
    name: tg_proxy
    image: telegrammessenger/proxy:latest
    state: started
    recreate: true
    restart_policy: always
    published_ports:
      - "{{ mtproxy_proxy_port }}:443"
    env:
      SECRET: "{{ mtproxy_user_secret }}"
      TAG: "{{ proxy_tag }}"

- name: Ensure nftables.d directory exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: Deploy MTProto nftables snippet
  ansible.builtin.template:
    src: mtproto.nft.j2
    dest: /etc/nftables.d/mtproto.nft
    mode: "0644"
  notify: Reload nftables

- name: Include MTProto in nftables config
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    line: 'include "/etc/nftables.d/mtproto.nft"'
    insertafter: EOF
  notify: Reload nftables

- name: Ensure nftables is running
  ansible.builtin.systemd:
    name: nftables
    state: started
    enabled: true

- name: Show Proxy Link
  ansible.builtin.debug:
    msg:
      - "Ваша ссылка: tg://proxy?server={{ ansible_host }}&port={{ mtproxy_proxy_port }}&secret={{ mtproxy_user_secret }}"
